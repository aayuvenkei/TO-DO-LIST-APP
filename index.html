<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Task Manager</title>
    <style>
        /* Modern Design CSS */
        :root {
            --primary-color: #4a90e2;
            --secondary-color: #50c878;
            --danger-color: #e74c3c;
            --bg-gradient-start: #667eea;
            --bg-gradient-end: #764ba2;
            --text-dark: #2c3e50;
            --text-light: #7f8c8d;
            --bg-white: #ffffff;
            --bg-light: #f8f9fa;
            --border-color: #e1e8ed;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-dark);
        }

        .app-wrapper {
            width: 100%;
            max-width: 650px;
        }

        .task-container {
            background: var(--bg-white);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .app-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .app-header h1 {
            font-size: 2.2em;
            color: var(--primary-color);
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-light);
            font-size: 0.95em;
        }

        .add-task-section {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
        }

        .task-input {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 15px;
            outline: none;
        }

        .task-input:focus {
            border-color: var(--primary-color);
        }

        .btn-add {
            padding: 14px 28px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-add:hover {
            background: #357abd;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: var(--bg-light);
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-label {
            display: block;
            font-size: 0.85em;
            color: var(--text-light);
            margin-bottom: 5px;
        }

        .stat-value {
            display: block;
            font-size: 1.5em;
            font-weight: 700;
            color: var(--primary-color);
        }

        .view-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .view-btn {
            flex: 1;
            padding: 12px;
            background: var(--bg-light);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-dark);
        }

        .view-btn.selected {
            background: var(--primary-color);
            color: white;
        }

        .tasks-wrapper {
            min-height: 200px;
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px;
            background: var(--bg-light);
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .task-item.completed {
            opacity: 0.6;
        }

        .task-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .task-text {
            flex: 1;
            font-size: 15px;
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
            color: var(--text-light);
        }

        .btn-delete {
            padding: 8px 14px;
            background: var(--danger-color);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
        }

        .btn-secondary {
            padding: 12px 24px;
            background: transparent;
            color: var(--danger-color);
            border: 2px solid var(--danger-color);
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-secondary:hover {
            background: var(--danger-color);
            color: white;
        }

        .empty-message {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-light);
        }

        .empty-message span {
            font-size: 2.5em;
            display: block;
            margin-bottom: 10px;
        }

        .footer-actions {
            text-align: center;
        }

        @media (max-width: 600px) {
            .add-task-section { flex-direction: column; }
            .stats-bar { flex-direction: column; gap: 10px; }
            .view-controls { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <div class="task-container">
            <header class="app-header">
                <h1>📋 Task Manager</h1>
                <p class="subtitle">Stay organized, stay productive</p>
            </header>

            <div class="add-task-section">
                <input 
                    type="text" 
                    id="newTaskInput" 
                    class="task-input"
                    placeholder="What do you need to do today?"
                    maxlength="100"
                >
                <button id="addTaskButton" class="btn-add">Add Task</button>
            </div>

            <div class="stats-bar">
                <div class="stat-item">
                    <span class="stat-label">Total:</span>
                    <span id="totalTasks" class="stat-value">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Pending:</span>
                    <span id="pendingTasks" class="stat-value">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Done:</span>
                    <span id="completedTasks" class="stat-value">0</span>
                </div>
            </div>

            <div class="view-controls">
                <button class="view-btn selected" data-view="all">All Tasks</button>
                <button class="view-btn" data-view="pending">Pending</button>
                <button class="view-btn" data-view="done">Completed</button>
            </div>

            <div id="taskListContainer" class="tasks-wrapper">
                <!-- Tasks will appear here -->
            </div>

            <div class="footer-actions">
                <button id="clearCompletedBtn" class="btn-secondary">
                    Clear Completed Tasks
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript Link -->
    <script src="app.js"></script>
</body>
</html>
