<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Task Manager</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Main wrapper -->
    <div class="app-wrapper">
        <div class="task-container">
            <!-- Header section -->
            <header class="app-header">
                <h1>📋 Task Manager</h1>
                <p class="subtitle">Stay organized, stay productive</p>
            </header>

            <!-- Add new task area -->
            <div class="add-task-section">
                <input 
                    type="text" 
                    id="newTaskInput" 
                    class="task-input"
                    placeholder="What do you need to do today?"
                    maxlength="100"
                >
                <button id="addTaskButton" class="btn-add">Add Task</button>
            </div>

            <!-- Stats bar -->
            <div class="stats-bar">
                <div class="stat-item">
                    <span class="stat-label">Total:</span>
                    <span id="totalTasks" class="stat-value">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Pending:</span>
                    <span id="pendingTasks" class="stat-value">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Done:</span>
                    <span id="completedTasks" class="stat-value">0</span>
                </div>
            </div>

            <!-- View toggle buttons -->
            <div class="view-controls">
                <button class="view-btn selected" data-view="all">All Tasks</button>
                <button class="view-btn" data-view="pending">Pending</button>
                <button class="view-btn" data-view="done">Completed</button>
            </div>

            <!-- Task list container -->
            <div id="taskListContainer" class="tasks-wrapper">
                <!-- Tasks will appear here -->
            </div>

            <!-- Footer actions -->
            <div class="footer-actions">
                <button id="clearCompletedBtn" class="btn-secondary">
                    Clear Completed Tasks
                </button>
            </div>
        </div>
    </div>

    <!-- Load JavaScript -->
    <script src="app.js"></script>
</body>
</html>
